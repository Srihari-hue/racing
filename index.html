<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dusk Run</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff3e0;--dim:#d6c3df;--gold:#ffd27a;--night:#140a30;--bg:#140a30;color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140a30}}
:root[data-theme="dark"]{--bg:#140a30}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:Manrope,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px;pointer-events:none;font-family:Unbounded,Manrope,sans-serif;text-shadow:0 2px 12px rgba(10,4,30,.6)}
#hud b{display:block;font-weight:800;font-size:clamp(28px,6vw,54px);line-height:1}
#hud span{font:600 12px Manrope,sans-serif;color:var(--dim);letter-spacing:.04em}
#hud div:nth-child(2){text-align:center}#hud div:nth-child(3){text-align:right}
#time.low{color:#ff6b7a}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font:800 clamp(22px,5vw,40px) Unbounded,sans-serif;color:var(--gold);opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 4px 24px rgba(10,4,30,.8)}
#msg.on{opacity:1}
#ov{position:fixed;inset:0;display:flex;align-items:center;padding:0 clamp(22px,7vw,96px);background:linear-gradient(90deg,rgba(14,8,48,.88),rgba(14,8,48,.45) 55%,rgba(14,8,48,0))}
#ov.hide,#hud.hide{display:none}
.card{max-width:440px}
h1{font:800 clamp(44px,9vw,92px)/.95 Unbounded,sans-serif;margin:0 0 18px;letter-spacing:-.02em}
#p{font-size:clamp(16px,2.4vw,19px);line-height:1.55;color:var(--dim);margin:0 0 26px}
button{font:800 16px Unbounded,sans-serif;background:var(--gold);color:var(--night);border:0;border-radius:999px;padding:16px 30px;cursor:pointer;box-shadow:0 8px 30px rgba(255,170,100,.35)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{display:block;margin-top:20px;color:var(--dim);font-size:13px}
#tc{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
#tc div{display:flex;gap:12px;pointer-events:auto}
#tc i{width:74px;height:74px;border-radius:50%;background:rgba(255,243,224,.14);border:2px solid rgba(255,243,224,.35);display:grid;place-items:center;font:800 13px Unbounded,sans-serif;font-style:normal;backdrop-filter:blur(6px)}
#tc i.on{background:rgba(255,210,122,.45)}
@media (pointer:coarse){#tc{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><div><b id="spd">0</b><span>km/h</span></div><div><b id="time">35</b><span>seconds left</span></div><div><b id="dst">0.0</b><span>km</span></div></div>
<div id="msg"></div>
<div id="ov"><div class="card"><h1 id="t">Dusk Run</h1><p id="p">Race the last light down the coast. Every checkpoint adds time to the clock, and slow traffic takes it away.</p><button id="go">Start engine</button><small id="h">Arrow keys or WASD to drive. Space brakes. M mutes the engine.</small></div></div>
<div id="tc"><div><i data-k="left">◀</i><i data-k="right">▶</i></div><div><i data-k="brake">BRAKE</i><i data-k="gas">GAS</i></div></div>
<script>
const $=s=>document.querySelector(s),C=$('#c'),g=C.getContext('2d');
let W,H,vig;
function rs(){const d=Math.min(devicePixelRatio||1,1.5);W=C.width=Math.round(innerWidth*d);H=C.height=Math.round(innerHeight*d);vig=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,Math.max(W,H)*.75);vig.addColorStop(0,'rgba(10,4,30,0)');vig.addColorStop(1,'rgba(10,4,30,.55)')}
addEventListener('resize',rs);rs();

/* ---------- track ---------- */
const SL=200,RW=2200,CAMH=1100,DD=220,CD=1/Math.tan(50*Math.PI/180),PZ=CAMH*CD;
const MAX=12000,ACC=MAX/4.2,BRK=-MAX*1.1,DEC=-MAX/5,OFFD=-MAX/2.2,OFFL=MAX/4;
const segs=[],lerp=(a,b,t)=>a+(b-a)*t,ease=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5),easeIn=(a,b,p)=>a+(b-a)*p*p,easeOut=(a,b,p)=>a+(b-a)*(1-(1-p)*(1-p));
const lastY=()=>segs.length?segs[segs.length-1].p2.wy:0;
function addSeg(curve,y){const n=segs.length,y1=lastY();segs.push({i:n,p1:{wy:y1,wz:n*SL},p2:{wy:y,wz:(n+1)*SL},curve,cars:[],spr:[],col:Math.floor(n/4)%2})}
function addRoad(e,h,l,curve,hill){const sy=lastY(),ey=sy+hill*SL,t=e+h+l;
 for(let i=0;i<e;i++)addSeg(easeIn(0,curve,i/e),ease(sy,ey,i/t));
 for(let i=0;i<h;i++)addSeg(curve,ease(sy,ey,(e+i)/t));
 for(let i=0;i<l;i++)addSeg(easeOut(curve,0,i/l),ease(sy,ey,(e+h+i)/t))}
[[25,25,25,0,0],[30,40,30,2,25],[30,30,30,-3,-25],[20,40,20,0,35],[25,30,25,4,-35],[20,20,20,-2,0],[30,40,30,-5,20],[25,30,25,3,-20],[30,60,30,0,0],[25,25,25,5,0],[25,25,25,-4,15],[20,30,20,2,-15]].forEach(a=>addRoad(...a));
const N=segs.length,TL=N*SL;
const seg=z=>segs[Math.floor(((z%TL)+TL)%TL/SL)];
segs.forEach(s=>{
 if(s.i>10&&s.i%5===0){const side=Math.random()<.5?-1:1;s.spr.push({o:side*(1.5+Math.random()*2.6),t:0,s:.7+Math.random()*.9});if(Math.random()<.5)s.spr.push({o:-side*(1.6+Math.random()*2.6),t:0,s:.7+Math.random()*.9})}
 if(s.i>10&&s.i%22===0)s.spr.push({o:(s.i/22%2?1:-1)*1.28,t:2,s:1});
 if(s.i===250||s.i===750)s.cp=true;
});
const COLS=['#ff4d6d','#4cc9f0','#f9c74f','#90be6d','#c77dff','#f8f9fa','#ff9e00'],LANES=[-.62,0,.62];
const traffic=[];
for(let i=0;i<38;i++){const c={z:12000+Math.random()*(TL-14000),o:LANES[i%3]+(Math.random()-.5)*.14,sp:MAX*(.2+Math.random()*.36),col:COLS[i%COLS.length]};traffic.push(c);seg(c.z).cars.push(c)}
const stars=Array.from({length:70},()=>[Math.random(),Math.random()*.8,.25+Math.random()*.6]);

/* ---------- state ---------- */
let mode='menu',pos=0,speed=0,px=0,steer=0,dist=0,distU=0,timeLeft=35,cpN=0,top=0,shake=0,bg=0,lastIdx=0,best=0,t0=0;
try{best=+localStorage.getItem('duskrun-best')||0}catch(e){}
const keys={left:0,right:0,gas:0,brake:0},reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake',' ':'brake'};
addEventListener('keydown',e=>{if(KM[e.key]){keys[KM[e.key]]=1;e.preventDefault()}if(e.key==='m'||e.key==='M')muted=!muted;if(e.key==='Enter'&&mode!=='play')start()});
addEventListener('keyup',e=>{if(KM[e.key])keys[KM[e.key]]=0});
document.querySelectorAll('#tc i').forEach(b=>{const k=b.dataset.k,on=v=>e=>{e.preventDefault();keys[k]=v;b.classList.toggle('on',!!v)};b.addEventListener('pointerdown',on(1));['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,on(0)))});

/* ---------- audio ---------- */
let ac,osc,gn,muted=false;
function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';gn=ac.createGain();gn.gain.value=0;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=650;osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}}

/* ---------- flow ---------- */
const msgEl=$('#msg');let msgT;
function say(t,ms=1400){msgEl.textContent=t;msgEl.classList.add('on');clearTimeout(msgT);msgT=setTimeout(()=>msgEl.classList.remove('on'),ms)}
function start(){audio();if(ac&&ac.state==='suspended')ac.resume();mode='play';pos=0;speed=0;px=0;steer=0;dist=0;distU=0;timeLeft=35;cpN=0;top=0;lastIdx=seg(PZ).i;
 $('#ov').classList.add('hide');$('#hud').classList.remove('hide');say('Go!',900)}
$('#go').onclick=start;
function over(){mode='over';const km=dist.toFixed(1);if(dist>best){best=dist;try{localStorage.setItem('duskrun-best',best)}catch(e){}}
 $('#t').textContent='Out of time';
 $('#p').textContent='You covered '+km+' km with a top speed of '+Math.round(top)+' km/h. Your best is '+best.toFixed(1)+' km.';
 $('#go').textContent='Race again';$('#h').textContent='Press Enter to restart.';
 $('#ov').classList.remove('hide');$('#hud').classList.add('hide')}

/* ---------- update ---------- */
function update(dt){
 let ps=seg(pos+PZ);
 if(mode==='menu'){speed=MAX*.34;px=Math.sin(t0/1800)*.35}
 else{
  const sp0=speed/MAX;
  if(mode==='play'){
   const dir=(keys.right?1:0)-(keys.left?1:0);
   steer=lerp(steer,dir,Math.min(1,dt*9));
   px+=dt*2.1*sp0*dir;
   if(keys.gas)speed+=ACC*dt;else if(keys.brake)speed+=BRK*dt;else speed+=DEC*dt;
   timeLeft-=dt;if(timeLeft<=0){timeLeft=0;over()}
  }else{speed+=DEC*2.5*dt;steer=lerp(steer,0,dt*5)}
  px-=dt*2.1*sp0*sp0*ps.curve*.3*(MAX/ MAX)*1.4;
  if((px<-1||px>1)&&speed>OFFL)speed+=OFFD*dt;
  px=Math.max(-2.2,Math.min(2.2,px));
  speed=Math.max(0,Math.min(MAX,speed));
  /* scenery & traffic collisions */
  for(const sp of ps.spr)if(Math.abs(px-sp.o)<(sp.t===2?.14:.24)&&speed>MAX*.12){speed=MAX*.1;shake=.5;px+=px>sp.o?.12:-.12;say('Crash!',600)}
  const pzm=(pos+PZ)%TL;
  for(const s of [ps,segs[(ps.i+1)%N]])for(const c of s.cars)if(speed>c.sp&&Math.abs(c.z-pzm)<SL*1.2&&Math.abs(px-c.o)<.4){speed=c.sp*.55;pos=((c.z-PZ-SL*1.3)%TL+TL)%TL;px+=px<c.o?-.18:.18;shake=.6;say('Crash!',600)}
 }
 const adv=dt*speed;pos=(pos+adv)%TL;
 if(mode==='play'){distU+=adv;dist+=speed/MAX*260*dt/3600;top=Math.max(top,speed/MAX*260);
  const cur=seg(pos+PZ).i;let i=lastIdx;while(i!==cur){i=(i+1)%N;if(segs[i].cp){cpN++;const b=Math.max(7.5,12-cpN*.6);timeLeft+=b;say('Checkpoint +'+b.toFixed(1)+'s',1500)}}lastIdx=cur}
 bg+=seg(pos).curve*(speed/MAX)*dt*60;
 shake=Math.max(0,shake-dt*1.6);
 /* traffic */
 for(const c of traffic){const o=seg(c.z);c.z=(c.z+c.sp*dt)%TL;const n=seg(c.z);if(o!==n){o.cars.splice(o.cars.indexOf(c),1);n.cars.push(c)}}
 /* engine sound */
 if(ac&&osc){const on=mode!=='menu'&&!muted;osc.frequency.value=48+speed/MAX*170;gn.gain.value=on?.045+speed/MAX*.03:0}
 /* hud */
 $('#spd').textContent=Math.round(speed/MAX*260);
 const tl=$('#time');tl.textContent=Math.ceil(timeLeft);tl.classList.toggle('low',timeLeft<8);
 $('#dst').textContent=dist.toFixed(1);
}

/* ---------- drawing ---------- */
const P={light:{grass:'#1f5e5a',road:'#4d4968',rumble:'#f4ecdd'},dark:{grass:'#1a4f4f',road:'#46425f',rumble:'#e5476b'},fog:'#a8476d',lane:'#f3e6c9'};
const poly=(a,b,c,d,e,f,h,i,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.lineTo(h,i);g.closePath();g.fill()};
function project(p,cxo,cy,cz){const z=p.wz-cz;p.z=z;p.s=CD/z;p.X=Math.round(W/2+p.s*(-cxo)*W/2);p.Y=Math.round(H/2-p.s*(p.wy-cy)*H/2);p.W=Math.round(p.s*RW*W/2)}
function sky(){
 const hz=H/2,gr=g.createLinearGradient(0,0,0,hz);
 gr.addColorStop(0,'#0e0830');gr.addColorStop(.42,'#4a1d62');gr.addColorStop(.8,'#c24a6e');gr.addColorStop(1,'#ffa069');
 g.fillStyle=P.fog;g.fillRect(0,hz,W,hz);
 g.fillStyle=gr;g.fillRect(0,0,W,hz+2);
 g.fillStyle='#fff';for(const s of stars){g.globalAlpha=s[2]*(1-s[1]);g.fillRect(((s[0]*W-bg*.04)%W+W)%W,s[1]*hz*.8,2,2)}g.globalAlpha=1;
 const R=H*.15,span=W*1.5,cx=((W*.62-bg*.07)%span+span)%span-W*.25,cy=hz-R*.55;
 const gl=g.createRadialGradient(cx,cy,R*.6,cx,cy,R*3.2);gl.addColorStop(0,'rgba(255,170,110,.55)');gl.addColorStop(1,'rgba(255,170,110,0)');
 g.fillStyle=gl;g.fillRect(cx-R*3.2,cy-R*3.2,R*6.4,R*6.4);
 const sg=g.createLinearGradient(0,cy-R,0,cy+R);sg.addColorStop(0,'#ffe9a8');sg.addColorStop(1,'#ff5f86');
 g.fillStyle=sg;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();
 g.fillStyle=gr;for(let k=0;k<5;k++)g.fillRect(cx-R,cy+R*(.08+k*.17),R*2,R*(.02+k*.022));
 const ridge=(amp,fr,off,col,sd)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,hz+2);for(let x=0;x<=W+10;x+=10){const u=(x+off)*fr;g.lineTo(x,hz-amp*(.5*Math.abs(Math.sin(u+sd))+.3*Math.abs(Math.sin(u*2.3+sd*1.7))+.2*Math.abs(Math.sin(u*5.3))))}g.lineTo(W,hz+2);g.fill()};
 ridge(H*.17,.0034,bg*.18,'#7a2f6c',1);ridge(H*.12,.006,bg*.36,'#43195e',4);ridge(H*.07,.011,bg*.7,'#240f42',9);
}
function tree(x,y,h,a){g.globalAlpha=a;const w=h*.07;g.fillStyle='#1a0e2c';g.fillRect(x-w/2,y-h*.18,w,h*.18);
 [['#0e3a3a',.5,.18,.58],['#13504a',.4,.4,.8],['#1a6a5c',.3,.62,1]].forEach(([c,hw,y0,y1])=>{g.fillStyle=c;g.beginPath();g.moveTo(x-h*hw*.5,y-h*y0);g.lineTo(x,y-h*y1);g.lineTo(x+h*hw*.5,y-h*y0);g.closePath();g.fill()});
 g.fillStyle='rgba(255,140,120,.35)';g.beginPath();g.moveTo(x+h*.02,y-h*.98);g.lineTo(x+h*.12,y-h*.64);g.lineTo(x+h*.02,y-h*.64);g.fill();g.globalAlpha=1}
function lamp(x,y,h,a,side){g.globalAlpha=a;const w=Math.max(2,h*.03);g.fillStyle='#2b2140';g.fillRect(x-w/2,y-h,w,h);g.fillRect(x-(side>0?h*.2:0),y-h,h*.2,w);
 const lx=x-side*h*.18,ly=y-h;g.fillStyle='rgba(255,200,120,.22)';g.beginPath();g.arc(lx,ly,h*.34,0,7);g.fill();g.fillStyle='#ffe0a0';g.beginPath();g.arc(lx,ly,h*.06,0,7);g.fill();g.globalAlpha=1}
function gate(a){const hw=a.W*1.2,h=a.W*1.25,t=a.W*.12;g.fillStyle='#2b2140';g.fillRect(a.X-hw-t/2,a.Y-h,t,h);g.fillRect(a.X+hw-t/2,a.Y-h,t,h);
 const n=14,cw=hw*2/n;for(let i=0;i<n;i++){g.fillStyle=i%2?'#ffd27a':'#2b2140';g.fillRect(a.X-hw+i*cw,a.Y-h,cw+1,t*1.6)}}
function car(cx,by,w,c,glow,tilt){const h=w*.55;g.save();g.translate(cx,by);if(tilt)g.rotate(tilt);
 g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,0,w*.58,w*.07,0,0,7);g.fill();
 g.fillStyle='#0b0814';g.fillRect(-w*.5,-h*.34,w*.16,h*.34);g.fillRect(w*.34,-h*.34,w*.16,h*.34);
 g.fillStyle=c;g.beginPath();g.roundRect(-w*.5,-h*.66,w,h*.46,w*.07);g.fill();
 g.beginPath();g.moveTo(-w*.38,-h*.64);g.lineTo(-w*.27,-h*.98);g.lineTo(w*.27,-h*.98);g.lineTo(w*.38,-h*.64);g.fill();
 g.fillStyle='#1a1232';g.beginPath();g.moveTo(-w*.31,-h*.67);g.lineTo(-w*.23,-h*.92);g.lineTo(w*.23,-h*.92);g.lineTo(w*.31,-h*.67);g.fill();
 g.fillStyle='rgba(255,170,150,.28)';g.beginPath();g.moveTo(-w*.31,-h*.67);g.lineTo(-w*.23,-h*.92);g.lineTo(-w*.05,-h*.92);g.lineTo(-w*.13,-h*.67);g.fill();
 g.fillStyle='rgba(0,0,0,.28)';g.fillRect(-w*.5,-h*.34,w,h*.14);
 g.fillStyle=c;g.fillRect(-w*.44,-h*1.04,w*.88,h*.07);
 if(glow){g.fillStyle='rgba(255,59,78,.35)';g.fillRect(-w*.56,-h*.62,w*.3,h*.26);g.fillRect(w*.26,-h*.62,w*.3,h*.26)}
 g.fillStyle=glow?'#ff6070':'#d4263c';g.fillRect(-w*.46,-h*.58,w*.2,h*.1);g.fillRect(w*.26,-h*.58,w*.2,h*.1);
 g.fillStyle='rgba(255,255,255,.3)';g.fillRect(-w*.5,-h*.66,w,Math.max(1,h*.02));
 g.fillStyle='#e9e1d0';g.fillRect(-w*.09,-h*.42,w*.18,h*.08);g.restore()}

function render(){
 const bs=seg(pos),bp=(pos%SL)/SL,pzs=seg(pos+PZ),pp=((pos+PZ)%SL)/SL;
 const camY=lerp(pzs.p1.wy,pzs.p2.wy,pp)+CAMH,camX=px*RW;
 g.save();
 if(shake>0&&!reduce)g.translate((Math.random()-.5)*shake*24,(Math.random()-.5)*shake*24);
 sky();
 let maxy=H,x=0,dx=-bs.curve*bp;
 for(let n=0;n<DD;n++){
  const s=segs[(bs.i+n)%N],lp=s.i<bs.i,cz=pos-(lp?TL:0);
  s.clip=maxy;project(s.p1,camX-x,camY,cz);project(s.p2,camX-x-dx,camY,cz);x+=dx;dx+=s.curve;
  s.fog=Math.pow(n/DD,2.1)*.96;s.ok=s.p1.z>CD;
  const a=s.p1,b=s.p2;
  if(!s.ok||b.Y>=a.Y||b.Y>=maxy)continue;
  const k=s.col?P.dark:P.light;
  g.fillStyle=k.grass;g.fillRect(0,b.Y,W,a.Y-b.Y);
  const r1=a.W/6,r2=b.W/6;
  poly(a.X-a.W-r1,a.Y,a.X-a.W,a.Y,b.X-b.W,b.Y,b.X-b.W-r2,b.Y,k.rumble);
  poly(a.X+a.W+r1,a.Y,a.X+a.W,a.Y,b.X+b.W,b.Y,b.X+b.W+r2,b.Y,k.rumble);
  poly(a.X-a.W,a.Y,a.X+a.W,a.Y,b.X+b.W,b.Y,b.X-b.W,b.Y,k.road);
  if(s.col)for(const l of [-1/3,1/3]){const l1=a.W/36,l2=b.W/36;poly(a.X+a.W*l-l1,a.Y,a.X+a.W*l+l1,a.Y,b.X+b.W*l+l2,b.Y,b.X+b.W*l-l2,b.Y,P.lane)}
  if(s.fog>.01){g.globalAlpha=s.fog;g.fillStyle=P.fog;g.fillRect(0,b.Y,W,a.Y-b.Y);g.globalAlpha=1}
  maxy=a.Y;
 }
 for(let n=DD-1;n>0;n--){
  const s=segs[(bs.i+n)%N];if(!s.ok)continue;const a=s.p1,b=s.p2,fa=1-s.fog*.85;
  const clipped=s.clip<a.Y;if(clipped){g.save();g.beginPath();g.rect(0,0,W,s.clip);g.clip()}
  if(s.cp&&a.W<W*2)gate(a);
  for(const sp of s.spr){const sx=a.X+a.W*sp.o;if(sx<-a.W*2||sx>W+a.W*2)continue;
   if(sp.t===2)lamp(sx,a.Y,a.W*1.05,fa,sp.o>0?1:-1);else tree(sx,a.Y,a.W*1.3*sp.s,fa)}
  for(const c of s.cars){const pct=(c.z%SL)/SL,cX=lerp(a.X,b.X,pct),cW=lerp(a.W,b.W,pct),cY=lerp(a.Y,b.Y,pct);
   g.globalAlpha=fa;car(cX+cW*c.o,cY,cW*.4,c.col,c.sp<speed,0);g.globalAlpha=1}
  if(clipped)g.restore();
 }
 const sp=speed/MAX;
 if(sp>.55&&!reduce){g.strokeStyle='rgba(255,230,200,'+(.14*(sp-.45))+')';g.lineWidth=2;g.beginPath();
  for(let i=0;i<16;i++){const an=Math.random()*6.283,r1=W*(.26+Math.random()*.2),r2=r1+W*(.08+.2*sp*Math.random());
   g.moveTo(W/2+Math.cos(an)*r1,H*.58+Math.sin(an)*r1*.55);g.lineTo(W/2+Math.cos(an)*r2,H*.58+Math.sin(an)*r2*.55)}g.stroke()}
 /* player */
 const pw=Math.min(W*.2,H*.34),py=H*.94,off=(px<-1||px>1)&&speed>OFFL?(Math.random()-.5)*5:0;
 const cone=g.createLinearGradient(0,py-pw*.5,0,H*.6);cone.addColorStop(0,'rgba(255,225,170,.22)');cone.addColorStop(1,'rgba(255,225,170,0)');
 g.fillStyle=cone;g.beginPath();g.moveTo(W/2-pw*.3,py-pw*.5);g.lineTo(W/2-pw*1.3,H*.6);g.lineTo(W/2+pw*1.3,H*.6);g.lineTo(W/2+pw*.3,py-pw*.5);g.fill();
 car(W/2+steer*pw*.06,py+off,pw,'#ff9f43',keys.brake||speed<MAX*.05,steer*.04);
 g.restore();
 g.fillStyle=vig;g.fillRect(0,0,W,H);
}

let last=0;
function frame(t){t0=t;const dt=Math.min((t-last)/1000,.05);last=t;update(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=t;frame(t)});
</script>
